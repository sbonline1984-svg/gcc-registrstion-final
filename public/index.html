<script>
function searchData() {
    let input = document.getElementById('searchInput').value.toUpperCase().trim();
    let table = document.getElementById('registrationTable');
    let tr = table.getElementsByTagName('tr');
    let found = false;

    // যদি একো লিখা নাই, তেন্তে টেবুলখন লুকুৱাই ৰাখিব
    if (input === "") {
        table.style.display = "none";
        return;
    }

    for (let i = 1; i < tr.length; i++) {
        let td = tr[i].getElementsByTagName('td')[1]; // Registration No. কলমটো
        if (td) {
            let txtValue = td.textContent || td.innerText;
            // কেৱল সম্পূৰ্ণ নম্বৰটো মিলিলেহে দেখুৱাব (Partial match নহয়)
            if (txtValue.toUpperCase() === input) {
                tr[i].style.display = "";
                found = true;
            } else {
                tr[i].style.display = "none";
            }
        }
    }

    // যদি নম্বৰটো মিলিছে, টেবুলখন দেখুৱাব, নহ’লে লুকুৱাব
    if (found) {
        table.style.display = "table";
    } else {
        table.style.display = "none";
    }
}

    document.getElementById('registrationTable').style.display = "none";
